name: service-center

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Створіть .env із .env.example}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sc-sql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Створіть .env із .env.example}
    volumes:
      - ./db:/db:ro
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for f in p1/schema.sql p1/procedures.sql p1/seed.sql; do
          echo ">>> $$f"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -I -i "/db/$$f"
        done
        echo ">>> SQL-бази розгорнуто"

  mongo:
    image: mongo:9.0
    container_name: sc-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Створіть .env із .env.example}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./db/p3:/db/p3:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo-init:
    image: mongo:9.0
    container_name: sc-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_USER: ${MONGO_ROOT_USERNAME:-root}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Створіть .env із .env.example}
    volumes:
      - ./db/p3:/db/p3:ro
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mongosh --quiet --host mongo --port 27017 -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" --authenticationDatabase admin \
          --file /db/p3/collections.js --file /db/p3/seed.js
        echo ">>> MongoDB-базу розгорнуто"

volumes:
  sqlserver-data:
  mongo-data:
